spring.application.name=EcommerceApi
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# Base64-encoded secret key (at least 256 bits for HS256)
jwt.secret=dG9tYWNhc0FuZEF0ZW5jaW9Xc0xhYjEwSnd0U2VjcmV0S2V5MjAyNg==
# Token validity in milliseconds (24 hours = 86400000)
jwt.expiration=86400000
